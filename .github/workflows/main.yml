# Simple workflow for deploying static content to GitHub Pages
name: Deploy app to Pages

on:
    # Runs on pushes targeting the default branch
    push:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    # Single deploy job since we're just deploying
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Test OAuth
              run: npm test
            - name: Check auth API configuration
              env:
                  AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL }}
              run: |
                  test -n "$AUTH_API_URL" || { echo "Set the VITE_AUTH_API_URL repository variable (see docs/figma-oauth-migration.md)."; exit 1; }
            - name: Build
              run: npm run build
              env:
                  VITE_ID: ${{ secrets.VITE_ID }}
                  VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL }}
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # Upload dist repository
                  path: "./dist"
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
