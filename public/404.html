<!doctype html><meta charset="utf-8"><title>Figma XR</title>
<script>
  // GitHub Pages history fallback, including the QR's fragment credentials.
  const base = '/figma-xr/';
  if (location.pathname.startsWith(base)) {
    sessionStorage.setItem('figma-xr-route', '/' + location.pathname.slice(base.length) + location.search + location.hash);
    location.replace(base);
  }
</script>
