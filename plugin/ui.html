<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 18px;
        font: 13px system-ui;
        background: var(--figma-color-bg, #f6f6f8);
        color: var(--figma-color-text, #20202a);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 9px;
        border: 1px solid #aaa;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      button {
        padding: 9px 12px;
        margin-top: 10px;
        border: 0;
        border-radius: 7px;
        background: #6045de;
        color: white;
        cursor: pointer;
      }
      button.secondary {
        background: #e4e0f4;
        color: #30234d;
      }
      #qr {
        display: block;
        margin: 14px auto 8px;
        width: 220px;
        height: 220px;
        background: white;
      }
      #link {
        display: block;
        text-align: center;
      }
      #status {
        font-size: 12px;
        min-height: 38px;
      }
      #connection {
        font-size: 12px;
        color: var(--figma-color-text-secondary, #666);
      }
      a {
        color: inherit;
      }
      small {
        display: block;
        margin-top: 5px;
        color: var(--figma-color-text-secondary, #666);
      }
      details {
        margin-top: 18px;
        border-top: 1px solid #aaa5;
        padding-top: 12px;
      }
      summary {
        cursor: pointer;
        font-size: 12px;
      }
      #pair {
        display: block;
        margin: 10px auto;
      }
      h1 + p {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Figma XR</h1>
    <p>Scan to bring your designs into AR.</p>
    <div id="connection">Connecting to Figma</div>
    <canvas
      id="qr"
      width="240"
      height="240"
      role="img"
      aria-label="Scan to connect your phone"
      hidden
    ></canvas
    ><a id="link" target="_blank" rel="noreferrer" hidden>Open companion</a>
    <p id="status" role="status" aria-live="polite">
      Starting the plugin…
    </p>
    <button id="pair" class="secondary">Retry connection</button>
    <div>
      <button class="secondary" id="selection">Add selected items</button>
      <button class="secondary" id="sync">Refresh catalog</button>
    </div>
    <details id="advanced">
      <summary>Connection settings</summary>
      <label for="website">Companion website</label
      ><input id="website" type="url" spellcheck="false" /><small
        >HTTPS address the phone can reach. Local testing uses the same
        Wi-Fi.</small
      >
      <label for="relay">Phone pairing server</label
      ><input
        id="relay"
        type="url"
        placeholder="Same origin as the companion website"
        spellcheck="false"
      />
      <label for="desktop-relay">Desktop pairing server</label
      ><input
        id="desktop-relay"
        type="url"
        placeholder="Same as the phone pairing server"
        spellcheck="false"
      /><small
        >Local builds connect through this computer. Both addresses must reach
        the same relay.</small
      >
      <button id="apply">Apply and reconnect</button>
    </details>
    <script>
      const showStartupError = () => {
        document.getElementById("connection").textContent =
          "Plugin startup error";
        document.getElementById("status").textContent =
          "The plugin UI could not start. Close and reopen it; the Figma developer console has the error details.";
      };
      window.addEventListener("error", showStartupError);
      window.addEventListener("unhandledrejection", showStartupError);
    </script>
    <script>
      /* BUNDLE */
    </script>
  </body>
</html>
